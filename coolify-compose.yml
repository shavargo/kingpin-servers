# Paste into Coolify: New Resource → Docker Compose Empty
# Requires image `kingpin-servers:latest` available on the host
# (load via: docker load < kingpin-servers.tar  OR pull from your registry)
#
# After deploy, open host firewall UDP 31500-31512 (game + Gamespy query ports).

services:
  dm:
    image: kingpin-servers:latest
    container_name: kingpin-dm
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "31510:31510/udp"
      - "31500:31500/udp"
    command:
      [
        "./kpded2",
        "+set",
        "dedicated",
        "1",
        "+set",
        "game",
        "mmod_dm",
        "+set",
        "port",
        "31510",
        "+exec",
        "server.cfg",
      ]

  ctf:
    image: kingpin-servers:latest
    container_name: kingpin-ctf
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "31511:31511/udp"
      - "31501:31501/udp"
    command:
      [
        "./kpded2",
        "+set",
        "dedicated",
        "1",
        "+set",
        "game",
        "ctf",
        "+set",
        "port",
        "31511",
        "+exec",
        "server.cfg",
      ]

  bagman:
    image: kingpin-servers:latest
    container_name: kingpin-bagman
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "31512:31512/udp"
      - "31502:31502/udp"
    command:
      [
        "./kpded2",
        "+set",
        "dedicated",
        "1",
        "+set",
        "game",
        "mmod_bm",
        "+set",
        "port",
        "31512",
        "+exec",
        "server.cfg",
      ]
