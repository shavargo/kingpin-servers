# Coolify app: kingpin-ctf — UDP 31511
services:
  ctf:
    build: .
    image: kingpin-servers:ctf
    container_name: kingpin-ctf
    restart: unless-stopped
    environment:
      KP_PORT: "31511"
      KP_HOSTNAME: "Shavargo's Kingpin CTF"
      KP_MAXCLIENTS: "16"
      KP_PUBLIC: "1"
      KP_FRAGLIMIT: "0"
      KP_TIMELIMIT: "10"
      KP_CAPTURELIMIT: "0"
      KP_MAP: ctf_terminal
    ports:
      - "31511:31511/udp"
