# Coolify app: kingpin-bagman — UDP 31512 (Botmatch via Wine)
services:
  bagman:
    build:
      context: .
      dockerfile: Dockerfile.bots
    image: kingpin-servers:bagman-bots
    container_name: kingpin-bagman
    restart: unless-stopped
    environment:
      KP_MODE: bm
      KP_PORT: "31512"
    ports:
      - "31512:31512/udp"
