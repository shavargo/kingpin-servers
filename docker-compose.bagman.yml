# Coolify app: kingpin-bagman — UDP 31512 (Botmatch via Wine)
# Override any KP_* via Coolify → Environment Variables (values below are defaults).
services:
  bagman:
    build:
      context: .
      dockerfile: Dockerfile.bots
    image: kingpin-servers:bagman-bots
    container_name: kingpin-bagman
    restart: unless-stopped
    environment:
      KP_MODE: "${KP_MODE:-bm}"
      KP_PORT: "${KP_PORT:-31512}"
      KP_HOSTNAME: "${KP_HOSTNAME:-Shavargo's Kingpin Bagman}"
      KP_MAXCLIENTS: "${KP_MAXCLIENTS:-16}"
      KP_PUBLIC: "${KP_PUBLIC:-1}"
      KP_MASTER: "${KP_MASTER:-master0.kingpin.info master1.kingpin.info master2.kingpin.info master3.kingpin.info master.shavargo.com}"
      KP_FRAGLIMIT: "${KP_FRAGLIMIT:-0}"
      KP_TIMELIMIT: "${KP_TIMELIMIT:-30}"
      KP_CASHLIMIT: "${KP_CASHLIMIT:-3000}"
      KP_MAP: "${KP_MAP:-team_pv}"
      KP_BOTSKILL: "${KP_BOTSKILL:-2}"
      KP_BOT_MAX: "${KP_BOT_MAX:-8}"
      KP_BOT_MAX_PLAYERS: "${KP_BOT_MAX_PLAYERS:-12}"
    volumes:
      # Private binaries/configs on host only — not in git.
      - /data/kingpin-private/kpded2.exe:/kingpin/kpded2.exe:ro
      - /data/kingpin-private/botmatch-v039.5/gamex86.dll:/kingpin/compbots/gamex86.dll:ro
      - /data/kingpin-private/botmatch-v039.5/server_bm.cfg:/kingpin/compbots/server_bm.cfg:ro
    ports:
      # Game port + Gamespy query port (gameport-10). Master validates via 31502.
      - "31512:31512/udp"
      - "31502:31502/udp"
