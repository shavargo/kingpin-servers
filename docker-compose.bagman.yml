# Coolify app: kingpin-bagman — UDP 31512 (Botmatch via Wine)
services:
  bagman:
    build:
      context: .
      dockerfile: Dockerfile.bots
    image: kingpin-servers:bagman-bots
    container_name: kingpin-bagman
    restart: unless-stopped
    environment:
      KP_MODE: bm
      KP_PORT: "31512"
      KP_HOSTNAME: "Shavargo's Kingpin Bagman"
      KP_MAXCLIENTS: "16"
      KP_PUBLIC: "1"
      KP_MASTER: "master0.kingpin.info master1.kingpin.info master2.kingpin.info master3.kingpin.info"
      KP_FRAGLIMIT: "0"
      KP_TIMELIMIT: "30"
      KP_CASHLIMIT: "3000"
      KP_MAP: team_pv
      KP_BOTSKILL: "2"
      KP_BOT_MAX: "8"
      KP_BOT_MAX_PLAYERS: "12"
    ports:
      # Game port + Gamespy query port (gameport-10). Master validates via 31502.
      - "31512:31512/udp"
      - "31502:31502/udp"
