// Bagman + AceBots - port 31512
// Bots spawn after the first human joins (Botmatch behavior).
set hostname "Shavargo's Kingpin Bagman"
set clientdir main
set public 1
setmaster master0.kingpin.info master1.kingpin.info master2.kingpin.info master3.kingpin.info
set maxclients 16
set props 1
set anti_spawncamp 1
set idle_client 120
set sv_enforcetime_kick 4
set sv_maxpps 120
set net_rcvbuf 64
set net_sndbuf 64
set dmflags 1812
set deathmatch 1
set teamplay 1
set fraglimit 0
set cashlimit 3000
set timelimit 30
set sv_botcfg 1
set sv_botskill 2
set sv_bot_max 8
set sv_bot_max_players 12
exec bot_setup.cfg
map team_pv
