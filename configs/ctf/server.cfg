// CTF - port 31511
set hostname "Shavargo's Kingpin CTF"
set public 1
setmaster master.kingpin.info
addcvarcheck ctfver !* STUFF exec ctf.cfg
setclientfiles autoexec.cfg.readme.txt
set deathmatch 1
set teamplay 4
set dmflags 324
set dm_locational_damage 0
set maxclients 16
set maxrate 25000
set g_mapcycle_file maps.txt
set fraglimit 0
set capturelimit 0
set timelimit 10
set keep_admin_status 1
set props 2
set anti_spawncamp 1
set sv_enforcetime_kick 4
set sv_maxpps 120
map ctf_terminal
